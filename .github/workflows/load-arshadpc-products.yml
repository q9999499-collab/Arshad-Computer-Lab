name: Load ArshadPc Catalog
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure catalog script is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="arshadpc-products.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker,tag+marker,1)
              else:
                  s += tag
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load ArshadPc product catalog"
          git push