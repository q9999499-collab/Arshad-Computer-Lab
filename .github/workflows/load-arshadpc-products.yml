name: Load ArshadPc Catalog
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure catalog scripts are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="arshadpc-products.js"></script>','<script src="arshadpc-catalog.js"></script>']
          marker='</body>'
          changed=False
          for tag in tags:
              if tag not in s:
                  s=s.replace(marker,tag+marker,1) if marker in s else s+tag
                  changed=True
          if changed:p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load complete ArshadPc catalog"
          git push