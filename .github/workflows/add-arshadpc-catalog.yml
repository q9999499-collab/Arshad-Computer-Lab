name: Add ArshadPc catalog

on:
  push:
    paths:
      - 'arshadpc-products.js'
      - '.github/workflows/add-arshadpc-catalog.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject catalog script into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="arshadpc-products.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + marker, 1)
              else:
                  s += tag
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html arshadpc-products.js
          git diff --cached --quiet || git commit -m 'Add ArshadPc product catalog to website'
          git push
