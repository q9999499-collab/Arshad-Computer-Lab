name: Fix Google Login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect Google Login to Supabase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          sdk = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if '@supabase/supabase-js' not in s:
              s = s.replace('</head>', sdk + '</head>', 1)
          old = "document.getElementById('googleBtn').onclick=()=>alert('Google login is configured through Supabase.');"
          new = """const SUPABASE_URL='https://oksovldnrfpilxxisykb.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_j1ONBh8-o3xsta4qFgzOlg_jKtIXAlZ';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);document.getElementById('googleBtn').onclick=async()=>{const btn=document.getElementById('googleBtn');btn.disabled=true;btn.textContent='Connecting...';const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+window.location.pathname}});if(error){alert('Google login error: '+error.message);btn.disabled=false;btn.textContent='Continue with Google';}};supabaseClient.auth.getSession().then(({data})=>{if(data.session){const btn=document.getElementById('googleBtn');btn.textContent='Signed in: '+(data.session.user.email||'Google');btn.disabled=true;}});"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'supabaseClient.auth.signInWithOAuth' not in s:
              marker = 'render(products);'
              s = s.replace(marker, new + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Google login with Supabase OAuth'
          git push
